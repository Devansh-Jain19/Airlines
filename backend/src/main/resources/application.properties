spring.application.name=airline-backend

# Database Source Settings (H2 with MySQL compatibility for local dev, overridable via env vars for production MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:airline_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Policy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Embedded Server Configuration
server.port=8080
