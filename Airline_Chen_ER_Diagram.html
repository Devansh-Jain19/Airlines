<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Airline Reservation System - Classic Peter Chen ER Diagram</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    margin: 0 0 8px 0;
    font-size: 24px;
    color: #38bdf8;
  }
  .header p {
    margin: 0;
    color: #94a3b8;
    font-size: 14px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 10px;
    font-size: 13px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .box-entity {
    width: 24px; height: 16px; background: #38bdf8; border: 1px solid #0284c7; border-radius: 2px;
  }
  .box-rel {
    width: 14px; height: 14px; background: #fb923c; border: 1px solid #ea580c; transform: rotate(45deg);
  }
  .box-pk {
    width: 24px; height: 14px; background: #fef08a; border: 1px solid #ca8a04; border-radius: 10px;
  }
  .box-attr {
    width: 24px; height: 14px; background: #e2e8f0; border: 1px solid #94a3b8; border-radius: 10px;
  }
  .canvas-container {
    overflow: auto;
    border: 1px solid #334155;
    border-radius: 12px;
    background: #1e293b;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    max-height: 85vh;
  }
  svg {
    display: block;
    min-width: 2600px;
    min-height: 1400px;
  }
  .entity {
    fill: #0284c7;
    stroke: #38bdf8;
    stroke-width: 2.5;
  }
  .entity-text {
    fill: #ffffff;
    font-weight: 700;
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: central;
    letter-spacing: 0.5px;
  }
  .rel {
    fill: #ea580c;
    stroke: #fb923c;
    stroke-width: 2;
  }
  .rel-text {
    fill: #ffffff;
    font-weight: 700;
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .attr {
    fill: #f1f5f9;
    stroke: #64748b;
    stroke-width: 1.5;
  }
  .attr-text {
    fill: #0f172a;
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: central;
    font-weight: 500;
  }
  .attr-pk {
    fill: #fef08a;
    stroke: #eab308;
    stroke-width: 2;
  }
  .attr-pk-text {
    fill: #713f12;
    font-size: 11px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
    text-decoration: underline;
  }
  .conn {
    stroke: #64748b;
    stroke-width: 1.5;
  }
  .rel-conn {
    stroke: #94a3b8;
    stroke-width: 2;
  }
  .card-label {
    fill: #38bdf8;
    font-weight: 800;
    font-size: 14px;
    text-anchor: middle;
    dominant-baseline: central;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Airlines Reservation System — Classic Peter Chen ER Diagram</h1>
